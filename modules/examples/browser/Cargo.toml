[package]
name = "browser-example"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
interstice-sdk = "0.5.0"

# ── Web engine ──────────────────────────────────────────────────────────────
# Blitz: a real HTML/CSS engine (html5ever parser, Servo's Stylo cascade,
# Taffy block/flex/grid/float layout, Parley text). Pure Rust → builds for
# wasm32-unknown-unknown. Default features are off to drop OS font discovery
# (`system-fonts`) and accesskit; fonts are embedded instead (see fonts.rs).
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = ["svg", "floats", "woff", "autofocus"] }
blitz-html = "=0.3.0-beta.4"
blitz-paint = { version = "=0.3.0-beta.4", default-features = false, features = ["svg", "scrollbars"] }
blitz-traits = "=0.3.0-beta.4"
# CPU rasteriser: Blitz paints into an anyrender scene, vello_cpu turns it into
# RGBA8 pixels that we upload as a texture to the graphics module.
anyrender = "0.14"
anyrender_vello_cpu = "0.18"
# Same versions anyrender uses; needed to pre-fill the canvas (Blitz leaves it
# transparent when neither <html> nor <body> sets a background).
kurbo = "0.13"
peniko = "0.6"
parley = "0.12"
keyboard-types = "0.8"
url = "2"
cursor-icon = "1"
bytes = "1"
# Patched to vendor/web-time (workspace root): we drive its clock via `set_now`.
web-time = "1.1"
# Decoders for <img> (Blitz decodes through `image` with no formats enabled by
# itself; enabling them here unifies the features).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
# blitz/stylo pull getrandom 0.3 which needs a custom backend on
# wasm32-unknown-unknown; we define `__getrandom_v03_custom` in lib.rs.
getrandom = "0.3"
# JavaScript engine (pure Rust, builds for wasm). 0.22: 0.21 pins icu ~2.0,
# which conflicts with blitz-dom's icu_properties ^2.3.
boa_engine = { version = "0.22", default-features = false }

[build-dependencies]
interstice-sdk = "0.5.0"
