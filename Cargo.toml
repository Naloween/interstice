[workspace]
members = ["crates/*", "modules/defaults/*", "modules/examples/*", "modules/benchmarks/*"]
resolver = "3"

# Shared by the published crates (RELEASING.md): one version to bump.
[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/naloween/interstice"

# The internal crates, by path for the workspace and by version for crates.io.
[workspace.dependencies]
interstice-abi = { path = "crates/interstice-abi", version = "0.6.0" }
interstice-abi-macros = { path = "crates/interstice-abi-macros", version = "0.6.0" }
interstice-core = { path = "crates/interstice-core", version = "0.6.0" }
interstice-client = { path = "crates/interstice-client", version = "0.6.0" }
interstice-sdk = { path = "crates/interstice-sdk", version = "0.6.0" }
interstice-sdk-core = { path = "crates/interstice-sdk-core", version = "0.6.0" }
interstice-sdk-macros = { path = "crates/interstice-sdk-macros", version = "0.6.0" }
interstice-ui = { path = "crates/interstice-ui" }  # not published

[patch.crates-io]
# blitz-dom → web-time, which on wasm32 calls into JS via wasm-bindgen (no JS
# host here). The vendored shim keeps the same API but reads a clock the
# browser module advances from `time_now_ms` each frame.
web-time = { path = "vendor/web-time" }
# blitz-dom 0.3.0-beta.4 with one layout fix (search "interstice patch"): a
# table's specified width acts as a minimum, as CSS 2.1 §17.5.2 requires
# (used width = max(width, min-content)), instead of a fixed size that its
# content overflows (e.g. Wikipedia infoboxes).
blitz-dom = { path = "vendor/blitz-dom" }
