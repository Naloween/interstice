[package]
name = "interstice-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Benchmarks of the Interstice engine, comparable to SpacetimeDB's (benchmarks/README.md)"

[dependencies]
interstice-core = { workspace = true }
interstice-client = { workspace = true }
tokio = { version = "1.49", features = ["full"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"

[dev-dependencies]
criterion = { version = "0.7", features = ["async_tokio"] }

[[bench]]
name = "generic"
harness = false
