[package]
name = "interstice-abi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WASM ABI types and host-call interfaces for the Interstice runtime"
readme = "../../README.md"
repository.workspace = true
homepage = "https://github.com/naloween/interstice"
keywords = ["interstice", "wasm", "abi", "runtime"]
[package.metadata.docs.rs]
all-features = true

[dependencies]
serde = "1.0"
postcard = { version = "1.1.3", features = ["alloc"] }
toml = "0.9"
interstice-abi-macros = { workspace = true }
bitflags = { version = "2.10", features = ["serde"] }
