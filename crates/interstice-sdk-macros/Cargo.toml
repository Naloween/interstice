[package]
name = "interstice-sdk-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Procedural macros to generate typed SDK bindings for Interstice modules"
readme = "../../README.md"
repository.workspace = true
keywords = ["interstice", "wasm", "proc-macro", "sdk"]
[package.metadata.docs.rs]
all-features = true

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "visit-mut"] }
quote = "1"
proc-macro2 = "1"
interstice-abi = { workspace = true }
interstice-sdk-core = { workspace = true }
toml = "0.7"
