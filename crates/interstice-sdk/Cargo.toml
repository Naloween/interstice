[package]
name = "interstice-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust SDK and helpers for writing Interstice WASM modules"
readme = "../../README.md"
repository.workspace = true
keywords = ["interstice", "wasm", "sdk"]
[package.metadata.docs.rs]
all-features = true

[dependencies]
interstice-abi = { workspace = true }
interstice-sdk-core = { workspace = true }
interstice-sdk-macros = { workspace = true }
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
prettyplease = "0.2"

[dev-dependencies]
trybuild = "1"
