[package]
name = "interstice-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line tools to run and manage Interstice nodes and modules"
readme = "../../README.md"
repository.workspace = true
keywords = ["interstice", "cli", "wasm", "runtime"]
# The default modules are built, not tracked; the package carries them.
include = ["src/**", "build.rs", "module_defaults/*.wasm", "Cargo.toml"]
[package.metadata.docs.rs]
all-features = true

[[bin]]
name = "interstice"
path = "src/main.rs"

[dependencies]
directories = "6.0.0"
interstice-core = { workspace = true }
interstice-client = { workspace = true }
mimalloc = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
self_update = { version = "0.41.0", default-features = false, features = [
    "rustls",
    "archive-tar",
    "archive-zip",
    "compression-flate2",
] }
toml = "0.9"
tokio = { version = "1.49", features = ["full"] }
uuid = { version = "1.20.0", features = ["v4"] }
