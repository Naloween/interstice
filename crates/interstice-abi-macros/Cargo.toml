[package]
name = "interstice-abi-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Procedural macros for generating ABI types and helpers for Interstice"
readme = "../../README.md"
repository.workspace = true
keywords = ["interstice", "wasm", "proc-macro"]
[package.metadata.docs.rs]
all-features = true

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
proc-macro-crate = "3"
