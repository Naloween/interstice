[package]
name = "interstice-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Client library for programs that talk to an Interstice node: reducer calls with results, queries, schemas"
readme = "../../README.md"
repository.workspace = true
keywords = ["interstice", "client", "sdk"]

[dependencies]
interstice-core = { workspace = true }
tokio = { version = "1.49", features = ["full"] }
uuid = { version = "1.20", features = ["v4"] }
parking_lot = "0.12"
