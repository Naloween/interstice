[package]
name = "interstice-sdk-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core SDK utilities used by Interstice modules and macros"
readme = "../../README.md"
repository.workspace = true
keywords = ["interstice", "wasm", "sdk", "core"]
[package.metadata.docs.rs]
all-features = true

[dependencies]
interstice-abi = { workspace = true }
lazy_static = "1.5"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }
toml = { version = "0.9", features = ["serde"] }
