[package]
name = "web-time"
version = "1.1.0"
edition = "2021"
publish = false
description = "Interstice drop-in for the `web-time` crate. On wasm32-unknown-unknown the upstream crate calls into JS (`performance.now()` via wasm-bindgen), which the Interstice host doesn't provide. This version reads a module-driven clock instead (see `set_now`)."

